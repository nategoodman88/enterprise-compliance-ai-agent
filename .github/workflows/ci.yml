name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    # We pass mock environment variables so the build process doesn't fail on missing keys
    - name: Verify Next.js Build
      run: npm run build
      env:
        DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"
        OPENAI_API_KEY: "mock-key"
        ANTHROPIC_API_KEY: "mock-key"

    - name: Test Docker Build
      run: docker build -t compliance-agent-test .